<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1180" role="img" aria-labelledby="title desc">
  <title id="title">River and walkway connection audit</title>
  <desc id="desc">Normalized top-down audit of the customer map. The deep river spans the center. Only west, center, and east bridges cross it.</desc>
  <rect width="1120" height="1180" fill="#f4f1ea"/>
  <text x="60" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#20252b">River / walkway connection audit</text>
  <text x="60" y="78" font-family="Arial,sans-serif" font-size="16" fill="#4c555d">Normalized layout used by shape preview, height route protection, and road paint " north ‘</text>
  <rect x="60" y="120" width="1000" height="1000" rx="8" fill="#d8d3bf" stroke="#30363b" stroke-width="3"/>
  <path d="M60 555 C245 530 365 570 560 545 C750 520 875 560 1060 535 L1060 675 C875 700 750 660 560 685 C365 710 245 670 60 695 Z" fill="#476f88" stroke="#29485a" stroke-width="5"/>
