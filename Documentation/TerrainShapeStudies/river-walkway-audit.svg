  <text x="560" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5c4328">SHOP</text>
  <text x="875" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#30363b">NE TOWER</text>
  <text x="210" y="1045" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#30363b">SW TOWER</text>
  <text x="900" y="995" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6f3f42">SE ARENA / BOSS</text>
  <text x="560" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e3eff2">DEEP RIVER  NON-WALKABLE</text>
