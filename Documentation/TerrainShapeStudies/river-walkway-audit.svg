  <path d="M255 440 L210 330 L210 210 M560 440 L560 300 M855 440 L875 330 L875 210 M255 760 L250 860 L210 990 M560 760 L690 850 L900 990 M855 760 L900 870 L900 990" fill="none" stroke="#b98b55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="210" cy="210" r="42" fill="#8eaa72" stroke="#405e3b" stroke-width="3"/>
  <rect x="525" y="275" width="70" height="45" rx="5" fill="#c3a56d" stroke="#5c4328" stroke-width="3"/>
  <path d="M840 250 L875 195 L910 250 Z" fill="#8b9296" stroke="#30363b" stroke-width="3"/>
