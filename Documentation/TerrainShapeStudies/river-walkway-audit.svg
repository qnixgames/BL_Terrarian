    <rect x="125" width="18" height="18" fill="#b98b55"/><text x="150" y="14" fill="#30363b">walkway / bank path</text>
    <rect x="315" width="18" height="18" fill="#e8d7a6"/><text x="340" y="14" fill="#30363b">bridge crossing</text>
    <text x="475" y="14" fill="#4c555d">Only three bridges connect north and south.</text>
